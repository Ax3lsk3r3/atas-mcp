[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atas-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server connecting ATAS Platform and ATAS X to AI agents"
readme = "README.md"
authors = [{ name = "ATAS MCP Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
atas-mcp = "server:main"
