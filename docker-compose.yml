services:
  atas-mcp:
    build: .
    container_name: atas-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - ATAS_MCP_HOST=host.docker.internal
      - ATAS_MCP_PORT=8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
